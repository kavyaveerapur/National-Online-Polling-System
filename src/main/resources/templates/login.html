<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - National Online Polling System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 1.5rem;
        }
        .login-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            max-width: 440px;
            width: 100%;
            padding: 2.5rem;
        }
        .form-control {
            background: #0f172a;
            border: 1px solid #334155;
            color: #f8fafc;
            border-radius: 10px;
            padding: 0.75rem 1rem;
        }
        .form-control:focus {
            background: #0f172a;
            border-color: #38bdf8;
            color: #f8fafc;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.25);
        }
        .btn-login {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            border: none;
            font-weight: 600;
            padding: 0.8rem;
            border-radius: 10px;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
            transition: all 0.2s ease;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.6);
            background: linear-gradient(135deg, #0369a1 0%, #0284c7 100%);
        }
        .security-badge {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.2);
            color: #38bdf8;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.825rem;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center bg-info bg-opacity-20 rounded-circle p-3 mb-2 text-info">
            <i class="bi bi-box-seam-fill fs-2"></i>
        </div>
        <h3 class="fw-bold text-white mb-1">National Online Polling</h3>
        <p class="text-secondary small mb-2">Election Commission Portal</p>
        
        <div class="security-badge d-inline-flex align-items-center gap-1">
            <i class="bi bi-shield-check"></i> Protected with 2-Factor OTP Verification
        </div>
    </div>

    <div th:if="${error != null}" class="alert alert-danger py-2 text-center small mb-3">
        <i class="bi bi-exclamation-triangle-fill me-1"></i> <span th:text="${error}"></span>
    </div>

    <div th:if="${param.registered != null}" class="alert alert-success py-2 text-center small mb-3">
        <i class="bi bi-check-circle-fill me-1"></i> Registration successful! Please log in.
    </div>

    <form action="/login" method="post">
        <div class="mb-3">
            <label class="form-label text-secondary small text-uppercase fw-semibold">Email or Voter ID</label>
            <div class="input-group">
                <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-person-vcard"></i></span>
                <input type="text" name="loginIdentifier" placeholder="Email or Voter ID (e.g. VID-12345)" class="form-control" required>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label text-secondary small text-uppercase fw-semibold">Password</label>
            <div class="input-group">
                <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-key-fill"></i></span>
                <input type="password" name="password" placeholder="Enter Password" class="form-control" required>
            </div>
        </div>

        <button type="submit" class="btn btn-primary btn-login w-100 text-white mb-3">
            <i class="bi bi-arrow-right-circle me-2"></i> Sign In & Proceed to OTP
        </button>
    </form>

    <div class="text-center mt-3 pt-3 border-top border-secondary border-opacity-25">
        <a href="/register" class="text-info text-decoration-none small fw-semibold">Don't have an account? Register here</a>
    </div>
    <div class="text-center mt-2">
        <a href="/candidate/nominate" class="text-secondary small text-decoration-none">Candidate Self-Nomination Portal <i class="bi bi-box-arrow-up-right ms-1"></i></a>
    </div>
</div>

</body>
</html>
