<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Login</title>
</head>
<body class="container mt-5">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <span class="navbar-brand">Online Voting System</span>
    </div>
</nav>
<h2 class="text-center">Login</h2>

<form action="/login" method="post" class="col-md-4 mx-auto">

    <input type="text" name="email" placeholder="Email" class="form-control mb-3">
    <input type="password" name="password" placeholder="Password" class="form-control mb-3">

    <button type="submit" class="btn btn-primary w-100">Login</button>

</form>

<p class="text-danger text-center" th:text="${error}"></p>

<div class="text-center mt-3">
    <a href="/register">Register</a>
</div>

</body>
</html>
