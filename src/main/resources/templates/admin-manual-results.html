<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual Polling Booth Counts - Election Commission</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
        }
        .navbar-custom {
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .card-custom {
            background: rgba(30, 41, 59, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            padding: 2rem;
        }
        .form-control, .form-select {
            background: #0f172a;
            border: 1px solid #334155;
            color: #f8fafc;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-custom mb-4 py-3">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/dashboard">
            <i class="bi bi-calculator-fill text-warning fs-4"></i>
            <span>Manual Polling Results Portal</span>
        </a>
        <a href="/dashboard" class="btn btn-outline-light btn-sm rounded-pill"><i class="bi bi-arrow-left me-1"></i> Back to Dashboard</a>
    </div>
</nav>

<div class="container py-3 d-flex justify-content-center">
    <div class="card-custom col-lg-7">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-white mb-1"><i class="bi bi-file-earmark-bar-graph-fill text-warning me-2"></i>Add Manual Polling Booth Counts</h3>
            <p class="text-secondary small">Requirement viii: Combine manual paper polling counts with online votes for final results</p>
        </div>

        <div th:if="${param.updated != null}" class="alert alert-success py-2 text-center small mb-3">
            <i class="bi bi-check-circle-fill me-1"></i> Manual vote counts updated successfully!
        </div>

        <form th:action="@{/admin/manual-results}" method="post">
            <div class="mb-3">
                <label class="form-label text-secondary small text-uppercase fw-semibold">Select Candidate</label>
                <select name="candidateId" class="form-select" required>
                    <option value="" disabled selected>-- Choose Approved Candidate --</option>
                    <option th:each="c : ${candidates}" th:value="${c.id}" th:text="${c.name + ' (' + c.party + ' - ' + c.constituency + ')'}">Candidate</option>
                </select>
            </div>

            <div class="mb-4">
                <label class="form-label text-secondary small text-uppercase fw-semibold">Offline / Paper Manual Votes Count</label>
                <input type="number" name="manualVotes" min="0" class="form-control" placeholder="Total manual votes count" required>
            </div>

            <button type="submit" class="btn btn-warning w-100 fw-bold py-3 text-dark">
                <i class="bi bi-plus-circle-fill me-2"></i> Save & Recalculate Final Tallies
            </button>
        </form>
    </div>
</div>

</body>
</html>
