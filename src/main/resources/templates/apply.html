<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply for Voter ID Card - National Online Polling System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
        }
        .navbar-custom {
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .card-custom {
            background: rgba(30, 41, 59, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            padding: 2.5rem;
        }
        .form-control {
            background: #0f172a;
            border: 1px solid #334155;
            color: #f8fafc;
            border-radius: 10px;
            padding: 0.75rem 1rem;
        }
        .form-control:focus {
            background: #0f172a;
            border-color: #38bdf8;
            color: #f8fafc;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.25);
        }
        .btn-submit {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            border: none;
            font-weight: 600;
            padding: 0.8rem;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-custom mb-4 py-3">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/dashboard">
            <i class="bi bi-box-seam-fill text-info fs-4"></i>
            <span>National Online Polling System</span>
        </a>
        <a href="/dashboard" class="btn btn-outline-light btn-sm rounded-pill"><i class="bi bi-arrow-left me-1"></i> Back to Dashboard</a>
    </div>
</nav>

<div class="container py-3 d-flex justify-content-center">
    <div class="card-custom col-lg-7">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-white mb-1"><i class="bi bi-card-checklist text-info me-2"></i>Voter ID Application</h3>
            <p class="text-secondary small">Requirement i: Online application verified by Field Verification Officers</p>
        </div>

        <form th:action="@{/apply}" th:object="${app}" method="post" enctype="multipart/form-data">
            <div class="mb-3">
                <label class="form-label text-secondary small text-uppercase fw-semibold">Applicant Full Name</label>
                <input type="text" th:field="*{name}" class="form-control" placeholder="Full name as per official ID" required>
            </div>

            <div class="mb-3">
                <label class="form-label text-secondary small text-uppercase fw-semibold">Residential Address (For Field Verification)</label>
                <textarea th:field="*{address}" class="form-control" rows="3" placeholder="Complete street address, house no, area..." required></textarea>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label text-secondary small text-uppercase fw-semibold">Aadhaar / National ID No</label>
                    <input type="text" th:field="*{aadhaar}" class="form-control" placeholder="12-digit Aadhaar No" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label text-secondary small text-uppercase fw-semibold">Electoral Constituency</label>
                    <input type="text" th:field="*{constituency}" class="form-control" placeholder="e.g. North Delhi" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label text-secondary small text-uppercase fw-semibold">Upload Applicant Passport Photograph</label>
                <input type="file" name="photo" accept="image/*" class="form-control" required>
                <div class="form-text text-secondary small">Requirement i: Photograph mandatory for Voter ID card generation.</div>
            </div>

            <button type="submit" class="btn btn-primary btn-submit w-100 text-white">
                <i class="bi bi-send-fill me-2"></i> Submit Application for Field Verification
            </button>
        </form>
    </div>
</div>

</body>
</html>
