<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration - National Online Polling System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 2rem 1rem;
        }
        .register-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            padding: 2.5rem;
        }
        .form-control, .form-select {
            background: #0f172a;
            border: 1px solid #334155;
            color: #f8fafc;
            border-radius: 10px;
            padding: 0.75rem 1rem;
        }
        .form-control:focus, .form-select:focus {
            background: #0f172a;
            border-color: #38bdf8;
            color: #f8fafc;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.25);
        }
        .btn-register {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            border: none;
            font-weight: 600;
            padding: 0.8rem;
            border-radius: 10px;
            box-shadow: 0 4px 14px rgba(5, 150, 105, 0.4);
            transition: all 0.2s ease;
        }
        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(5, 150, 105, 0.6);
        }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center">
    <div class="register-card col-lg-7">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-white mb-1"><i class="bi bi-person-plus-fill text-success me-2"></i>Electoral Registration</h3>
            <p class="text-secondary small">Register for Online National Polling System</p>
        </div>

        <div th:if="${error != null}" class="alert alert-danger py-2 text-center small mb-3">
            <i class="bi bi-exclamation-triangle-fill me-1"></i> <span th:text="${error}"></span>
        </div>

        <form th:action="@{/register}" th:object="${user}" method="post">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label text-secondary small text-uppercase fw-semibold">Full Name</label>
                    <input type="text" th:field="*{name}" class="form-control" placeholder="John Doe" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label text-secondary small text-uppercase fw-semibold">Email Address</label>
                    <input type="email" th:field="*{email}" class="form-control" placeholder="john@example.com">
                </div>

                <div class="col-md-6">
                    <label class="form-label text-secondary small text-uppercase fw-semibold">Existing Voter ID (Optional)</label>
                    <input type="text" th:field="*{voterId}" class="form-control" placeholder="VID-123456">
                    <div class="form-text text-secondary small">Requirement ii: Pre-existing voter card holders use Voter ID.</div>
                </div>

                <div class="col-md-6">
                    <label class="form-label text-secondary small text-uppercase fw-semibold">Constituency / Area</label>
                    <input type="text" th:field="*{constituency}" class="form-control" placeholder="e.g. North Delhi, Central Mumbai">
                </div>

                <div class="col-md-6">
                    <label class="form-label text-secondary small text-uppercase fw-semibold">Password</label>
                    <input type="password" th:field="*{password}" class="form-control" placeholder="••••••••" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label text-secondary small text-uppercase fw-semibold">Account Role</label>
                    <select th:field="*{role}" class="form-select">
                        <option value="VOTER">General Voter</option>
                        <option value="FIELD_OFFICER">Field Verification Officer</option>
                        <option value="CANDIDATE">Election Candidate</option>
                        <option value="ADMIN">Election Commission Admin</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn btn-success btn-register w-100 text-white mt-4">
                <i class="bi bi-check-circle-fill me-2"></i> Create Account & Proceed
            </button>
        </form>

        <div class="text-center mt-3 pt-3 border-top border-secondary border-opacity-25">
            <a href="/" class="text-info text-decoration-none small fw-semibold">Already have an account? Sign In</a>
        </div>
    </div>
</div>

</body>
</html>
