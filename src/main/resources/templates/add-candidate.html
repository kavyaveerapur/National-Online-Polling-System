<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<h2>Add Candidate</h2>

<form th:action="@{/admin/add-candidate}" th:object="${candidate}" method="post">

    Name: <input type="text" th:field="*{name}"><br><br>

    Party: <input type="text" th:field="*{party}"><br><br>

    <button type="submit">Add Candidate</button>

</form>

</body>
</html>
