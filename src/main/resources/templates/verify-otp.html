<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Security Verification - National Online Polling System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 1.5rem;
        }
        .otp-card {
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            max-width: 460px;
            width: 100%;
            padding: 2.5rem;
        }
        .otp-input {
            letter-spacing: 0.5rem;
            font-size: 1.6rem;
            font-weight: 700;
            text-align: center;
            background: #0f172a !important;
            border: 2px solid #38bdf8 !important;
            color: #38bdf8 !important;
            border-radius: 10px;
            padding: 0.75rem;
        }
        .otp-input:focus {
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
        }
        .btn-verify {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            border: none;
            font-weight: 600;
            padding: 0.8rem;
            border-radius: 10px;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
        }
        .demo-badge {
            background: rgba(56, 189, 248, 0.15);
            border: 1px dashed #38bdf8;
            color: #38bdf8;
            padding: 12px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center">
    <div class="otp-card">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-20 rounded-circle p-3 mb-2 text-info">
                <i class="bi bi-shield-lock-fill fs-1"></i>
            </div>
            <h3 class="fw-bold text-white mb-1">OTP Verification</h3>
            <p class="text-secondary small">
                Security verification for <strong class="text-info" th:text="${pendingUser.name}">Voter</strong>
            </p>
        </div>

        <!-- Demo OTP Display Banner with One-Click Auto-Fill -->
        <div class="demo-badge text-center mb-4" th:if="${demoOtp != null}">
            <div class="small mb-1"><i class="bi bi-info-circle-fill me-1"></i> <strong>DEMO SECURITY CODE:</strong></div>
            <div class="d-flex align-items-center justify-content-center gap-2">
                <span class="fs-4 fw-bold text-warning" id="demoOtpCode" th:text="${demoOtp}">123456</span>
                <button type="button" class="btn btn-sm btn-warning fw-bold px-3 py-1 rounded-pill" onclick="autoFillOtp()">
                    <i class="bi bi-magic me-1"></i> Auto-Fill
                </button>
            </div>
        </div>

        <div th:if="${error != null}" class="alert alert-danger py-2 text-center small mb-3">
            <i class="bi bi-exclamation-triangle-fill me-1"></i> <span th:text="${error}"></span>
        </div>

        <div th:if="${msg != null}" class="alert alert-success py-2 text-center small mb-3">
            <i class="bi bi-check-circle-fill me-1"></i> <span th:text="${msg}"></span>
        </div>

        <form action="/verify-otp" method="post" autocomplete="off">
            <div class="mb-4">
                <label class="form-label text-secondary small text-uppercase fw-semibold mb-2">Enter 6-Digit Verification Code</label>
                <input type="text" id="otpInputField" name="otp" maxlength="6" class="form-control otp-input" placeholder="------" autofocus required>
            </div>

            <button type="submit" class="btn btn-primary btn-verify w-100 mb-3">
                <i class="bi bi-patch-check-fill me-2"></i> Verify & Proceed to Dashboard
            </button>
        </form>

        <div class="text-center mt-3 pt-2 border-top border-secondary border-opacity-25">
            <span class="text-secondary small">Didn't receive the code?</span>
            <a href="/resend-otp" class="text-info text-decoration-none small fw-semibold ms-1">Resend OTP</a>
        </div>
        <div class="text-center mt-2">
            <a href="/logout" class="text-muted text-decoration-none small"><i class="bi bi-arrow-left me-1"></i> Back to Login</a>
        </div>
    </div>
</div>

<script>
    function autoFillOtp() {
        const codeElement = document.getElementById("demoOtpCode");
        const inputField = document.getElementById("otpInputField");
        if (codeElement && inputField) {
            inputField.value = codeElement.innerText.trim();
            inputField.focus();
        }
    }
</script>

</body>
</html>
